# uc8179_gray4 on the Seeed reTerminal E1001 (ESP32-S3, 7.5" GDEY075T7).
# Display-focused example — merge buttons, sensors, deep sleep etc. from your
# existing E1001 config (Seeed wiki); this component only replaces the
# display: block there (platform waveshare_epaper, model 7.50inv2) and uses
# the same SPI bus.
#
# Note on busy_pin: Seeed's waveshare_epaper config sets `inverted: true` —
# do NOT invert here, the driver handles the active-low signal itself.

esphome:
  name: reterminal-e1001-gray4
  on_boot:
    priority: -100
    then:
      - component.update: eink_display

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# For local use (cloned repo). Without cloning, use instead:
#   - source: github://formorer/uc8179_gray4_esphome
#     components: [ uc8179_gray4 ]
external_components:
  - source:
      type: local
      path: components
    components: [ uc8179_gray4 ]

image:
  - file: images/demo-photo.png
    id: demo_photo
    type: GRAYSCALE

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: uc8179_gray4
    id: eink_display
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin: GPIO12
    busy_pin:
      number: GPIO13
      mode:
        input: true
        pullup: true
    # "otp" gives slightly deeper black on newer panels; if gray levels look
    # wrong or washed out, try "custom".
    lut_mode: otp
    update_interval: never
    lambda: |-
      it.image(0, 0, id(demo_photo));
      // First functional test? Use the 4 stripes instead:
      // it.filled_rectangle(0,   0, 800, 120, Color(0, 0, 0));
      // it.filled_rectangle(0, 120, 800, 120, Color(85, 85, 85));
      // it.filled_rectangle(0, 240, 800, 120, Color(170, 170, 170));
      // it.filled_rectangle(0, 360, 800, 120, Color(255, 255, 255));
